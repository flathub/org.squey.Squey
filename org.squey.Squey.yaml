app-id: org.squey.Squey
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: squey_launcher.sh
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --share=ipc
  - --filesystem=~/.squey:create
  - --filesystem=xdg-config/wireshark:ro
  - --device=dri
  - --allow=devel
modules:
  - name: squey
    buildsystem: simple
    build-commands:
      - cp -r files/* /app
    sources:
      - type: archive
        url: https://squey.gitlab.io/squey/squey_flatpak_5.3.0.tar.xz
        sha256: ecde25790a4caf90ab1b96ff3c9fe7a3c0a25038f99f37e596d3b1d4e6cdd67d
